# Initial HTTP site. Obtain the HTTPS certificate after DNS points here.
server {
    listen 80;
    listen [::]:80;
    server_name godaug.fun www.godaug.fun;

    root /opt/realweb/frontend/dist;
    index index.html;
    client_max_body_size 100m;

    access_log /var/log/nginx/realweb-access.log;
    error_log /var/log/nginx/realweb-error.log;

    # Inherit these headers in both proxy locations. Preserve /api and /uploads.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        # AI responses use Server-Sent Events.
        proxy_buffering off;
        proxy_cache off;
    }

    # The backend owns the private upload directory and serves its files.
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
