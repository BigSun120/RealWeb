# HTTP challenge endpoint for the SMTP host certificate.
server {
    listen 80;
    listen [::]:80;
    server_name mail.godaug.fun;
    root /var/lib/letsencrypt-realweb;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
