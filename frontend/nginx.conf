events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 允许较大的请求体（例如图片上传）
    client_max_body_size 10m;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # 基本设置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    # 上游后端服务
    upstream backend {
        server 127.0.0.1:8000;
    }

    # HTTPS 服务器（生产）
    server {
        listen 443 ssl; # managed by Certbot
        server_name godaug.fun www.godaug.fun;

        ssl_certificate /etc/letsencrypt/live/godaug.fun/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/godaug.fun/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        # 单站点内最大上传限制
        client_max_body_size 10m;

        # 前端静态文件
        location / {
            root /var/www/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存（独立 location，避免嵌套）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            root /var/www/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API 代理
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # 允许较大的请求体（例如图片上传）
            client_max_body_size 10m;

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 静态文件直出（头像、图片等）
        # 与生产环境 PM2 env_production.UPLOAD_PATH 保持一致（/var/www/uploads）
        location ^~ /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # 自定义错误页（可选）：413 请求体过大
        error_page 413 /413.html;
        location = /413.html {
            root /var/www/html;
            internal;
        }
    }

    # HTTP -> HTTPS 重定向（生产）
    server {
        listen 80;
        server_name godaug.fun www.godaug.fun;
        return 301 https://$host$request_uri; # managed by Certbot
    }
}
